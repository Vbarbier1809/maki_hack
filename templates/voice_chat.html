<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Voice Questionnaire</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 2rem; }
    button { padding: .6rem 1rem; font-size: 1rem; }
    .log { margin-top: 1rem; max-width: 800px; }
    .msg { margin: .25rem 0; }
    .msg .who { font-weight: 600; margin-right: .5rem; }
    .answers { margin-top: 1rem; padding: .75rem; background: #f6f6f6; border-radius: .5rem; }
  </style>
</head>
<body>
  <h1>Speech-to-Speech Questionnaire</h1>
  <p>Click "Start/Stop Recording" and answer out loud.</p>

  <button id="recordBtn">Start Recording</button>
  <button id="analyzeBtn" style="margin-left: 10px; background-color: #4CAF50; color: white; border: none; border-radius: 4px;">📊 Analyze Responses</button>
  <div class="log" id="log"></div>
  <div class="answers" id="answers" style="display:none;"></div>
  <div id="analysisStatus" style="margin-top: 10px; padding: 10px; border-radius: 4px; display: none;"></div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js" crossorigin="anonymous"></script>
  <script src="/static/app.js"></script>
</body>
</html>
